name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-runtimes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: lai-ultralytics
            context: dockers/backend
            file: dockers/backend/Dockerfile.ultralytics.runtime
          - name: lai-mmyolo
            context: dockers/backend
            file: dockers/backend/Dockerfile.mmyolo.runtime
    steps:
      - uses: actions/checkout@v4
      - name: Set image version
        run: echo "IMAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:${{ env.IMAGE_VERSION }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-apps:
    runs-on: ubuntu-latest
    needs: [build-runtimes]
    strategy:
      matrix:
        include:
          - name: lai-backend
            context: backend
            file: dockers/backend/Dockerfile
            extra-args: |
              MMYOLO_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/lai-mmyolo:${{ env.IMAGE_VERSION }}
          - name: lai-worker-general
            context: backend
            file: dockers/backend/Dockerfile.worker-general
          - name: lai-worker-gpu
            context: backend
            file: dockers/backend/Dockerfile.worker-gpu
            extra-args: |
              ULTRALYTICS_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/lai-ultralytics:${{ env.IMAGE_VERSION }}
              MMYOLO_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/lai-mmyolo:${{ env.IMAGE_VERSION }}
          - name: lai-frontend
            context: .
            file: dockers/frontend/Dockerfile
            extra-args: |
              VITE_API_URL=SAME_ORIGIN
          - name: lai-sam
            context: backend/sam_service
            file: dockers/sam/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Set image version
        run: echo "IMAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:${{ env.IMAGE_VERSION }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:latest
          build-args: ${{ matrix.extra-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dist-bundle:
    runs-on: ubuntu-latest
    needs: [build-apps]
    steps:
      - uses: actions/checkout@v4
      - name: Build slim distribution tarball
        env:
          LAI_GHCR_ORG: ${{ github.repository_owner }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/build_dist_bundle.sh "$VERSION"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/lai-dist-*.tar.gz
          generate_release_notes: true

  publish-pypi:
    runs-on: ubuntu-latest
    needs: [dist-bundle]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set package version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" pyproject.toml
      - name: Build and publish wheel
        run: |
          pip install build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
